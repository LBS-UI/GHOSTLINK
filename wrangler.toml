name = "ghostlink"
main = "src/worker.js"
compatibility_date = "2026-11-12"

# Static assets are served from ./public via the ASSETS binding.
# not_found_handling = "single-page-application" tells the assets layer
# to serve index.html for any path that doesn't match a real file — which
# is what a single-page PWA wants. Real files (sw.js, manifest, icons)
# are still served as-is.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Live request logs in `wrangler tail`. Useful for a field gadget.
[observability]
enabled = true